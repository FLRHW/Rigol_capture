name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q rigol_ds1054z_capture.py rigol_ds1054z_gui.py rigol_gui_core.py test_rigol_capture.py test_rigol_decimation.py test_rigol_gui_core.py
      - name: Run offline unit tests (no oscilloscope required)
        run: python -m unittest discover -v
